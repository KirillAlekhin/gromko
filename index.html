<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Громко и вместе</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one 9:16 phone frame; logo bar, resources, pixel scene, goal strip, tabbed action tiles */
  --night:#15112b;      /* backdrop */
  --panel:#241d45;      /* surfaces */
  --panel-hi:#3a2f6b;   /* tiles */
  --ink:#f6ecd4;        /* text, logo cream */
  --dim:#b9b2d8;        /* secondary text */
  --hot:#ff4d6d;        /* accent: logo shadow red */
  --coin:#ffd23f;       /* money */
  --crowd:#3ddbd9;      /* listeners */
  --fire:#ff8a3d;       /* enthusiasm */
  --ok:#7be07b;
  --edge:#0a0818;
  --font:"Onest","Trebuchet MS",Verdana,sans-serif;        /* текст */
  --px:"Dela Gothic One","Arial Black",Impact,sans-serif;   /* названия и цифры: афишный гротеск */
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--font);display:flex;align-items:center;justify-content:center;overflow:hidden;
  background-image:linear-gradient(45deg,#1b1637 25%,transparent 25%,transparent 75%,#1b1637 75%),linear-gradient(45deg,#1b1637 25%,transparent 25%,transparent 75%,#1b1637 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.frame{height:100%;aspect-ratio:9/16;max-width:100%;max-height:calc(100vw*16/9);container-type:size;position:relative;background:var(--night);box-shadow:0 0 0 4px var(--edge)}
.game{position:absolute;inset:0;display:flex;flex-direction:column;font-size:4.1cqw;line-height:1.15;font-weight:500}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:.6cqw solid var(--coin);outline-offset:-.6cqw}
[hidden]{display:none!important}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}

.top{display:flex;align-items:center;gap:1.6cqw;padding:2cqw 3cqw 1.4cqw}
.top img{height:8.4cqw;width:auto;margin-right:auto}
.chip{background:var(--panel);padding:1.4cqw 2.2cqw;box-shadow:0 .7cqw 0 var(--edge);font-size:.9em;white-space:nowrap;max-width:40cqw;overflow:hidden;min-height:8.4cqw}
.chip.ic{width:9.4cqw;padding:1.6cqw;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.chip.ic svg{width:100%;height:100%}
.chip:active{transform:translateY(.4cqw);box-shadow:0 .3cqw 0 var(--edge)}
.chip.who{background:var(--hot);color:var(--edge)}
.res{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:1.4cqw;padding:0 3cqw 1.8cqw}
.res>div{background:var(--panel);padding:1.2cqw 1.8cqw;min-width:0}
.res .num{display:flex;align-items:baseline;gap:1.2cqw;font-size:1.3em;white-space:nowrap;overflow:hidden}
.res .num small{font-size:.6em}.res .num small.up{color:var(--ok)}.res .num small.dn{color:var(--hot)}
.res .lbl{font-size:.8em;color:var(--dim);white-space:nowrap}
#rM{color:var(--coin)}#rL{color:var(--crowd)}#rE{color:var(--fire)}
.ebar{height:1.2cqw;background:var(--edge);margin-top:.5cqw}
.ebar i{display:block;height:100%;background:var(--fire)}

.scene{position:relative;flex:none;border-block:1cqw solid var(--edge)}
.scene canvas{display:block;width:100%;aspect-ratio:240/150}
.plate{position:absolute;left:2cqw;top:2cqw;background:var(--edge);font-size:.9em;padding:1cqw 1.8cqw}
.badges{position:absolute;right:2cqw;top:2cqw;display:flex;flex-direction:column;gap:1cqw;align-items:flex-end}
.badges span{background:var(--coin);color:var(--edge);font-size:.86em;padding:.7cqw 1.6cqw}
.badges .warn{background:var(--hot)}.badges .tr{background:var(--crowd)}
.fl{position:absolute;top:42%;font-weight:700;font-size:1.25em;pointer-events:none;white-space:nowrap;text-shadow:.5cqw .5cqw 0 var(--edge);animation:fl 1.4s steps(14) forwards;color:var(--ink)}
.fl.L{color:var(--crowd)}.fl.M{color:var(--coin)}.fl.bad{color:var(--hot)}
@keyframes fl{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-24cqw);opacity:0}}
.prog{position:absolute;left:0;right:0;bottom:0;background:rgba(10,8,24,.88);padding:1.2cqw 2.4cqw;display:flex;align-items:center;gap:2cqw;font-size:.86em;font-weight:600}
.prog .bar{flex:1;height:2.2cqw;background:var(--panel)}
.prog .bar i{display:block;height:100%;background:var(--coin)}
#mail{position:absolute;left:62%;top:34%;width:13cqw;height:10cqw;background:var(--ink);box-shadow:0 0 0 .8cqw var(--edge),0 1.6cqw 0 .8cqw var(--edge);animation:bobm .8s steps(2) infinite}
#mail::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 47%,var(--edge) 47% 53%,transparent 53%) left/50% 60% no-repeat,linear-gradient(to bottom left,transparent 47%,var(--edge) 47% 53%,transparent 53%) right/50% 60% no-repeat}
#mail::after{content:"";position:absolute;right:-2cqw;top:-2cqw;width:4cqw;height:4cqw;background:var(--hot);box-shadow:0 0 0 .6cqw var(--edge)}
@keyframes bobm{50%{transform:translateY(-1.4cqw)}}
.toast{position:absolute;left:3cqw;right:3cqw;bottom:9cqw;background:var(--ink);color:var(--edge);padding:2cqw 2.6cqw;box-shadow:0 1cqw 0 var(--hot);text-align:left;display:block}
.toast b{display:block;font-weight:700;font-size:1.05em}
.toast span{font-size:.86em;font-weight:500}
.log{padding:1.4cqw 3cqw;font-size:.9em;min-height:11cqw;display:flex;align-items:center;background:var(--edge)}
.log.good{color:var(--ok)}.log.bad{color:var(--hot)}.log.hit{color:var(--coin)}

.goal{margin:2cqw 3cqw 0;background:var(--panel);padding:1.6cqw 2cqw;display:flex;flex-direction:column;gap:1.2cqw;border-left:1.2cqw solid var(--hot)}
.goal .row{display:flex;gap:1.4cqw;align-items:center;flex-wrap:wrap}
.goal .t{color:var(--dim);flex:1}
.goal{cursor:pointer}
.goal .q{display:inline-block;background:var(--edge);color:var(--coin);padding:0 1.6cqw;margin-left:1cqw}
.goal .t b{color:var(--ink);font-weight:700}
.pill{font-size:.84em;padding:.6cqw 1.5cqw;background:var(--edge);color:var(--dim);font-weight:600}
.pill.done{color:var(--edge);background:var(--ok)}
.move{background:var(--hot);color:var(--edge);font-weight:700;padding:1.5cqw 2.2cqw;box-shadow:0 .8cqw 0 #8a1c33;font-size:.9em}
.move.off{background:var(--panel-hi);color:var(--dim);box-shadow:0 .8cqw 0 var(--edge)}
.move.go{animation:pulse .7s steps(2) infinite}
@keyframes pulse{50%{background:var(--coin)}}
.move:active{transform:translateY(.5cqw)}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:1cqw;padding:2cqw 3cqw 0}
.tabs button{padding:1.8cqw 0;background:var(--panel);color:var(--dim);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--edge)}
.list{flex:1;min-height:0;overflow-y:auto;padding:1.8cqw 3cqw 3cqw;display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;align-content:start;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.act{display:flex;flex-direction:column;gap:.5cqw;text-align:left;background:var(--panel-hi);padding:1.8cqw 2cqw 1.6cqw;box-shadow:0 .9cqw 0 var(--edge);min-height:18cqw;min-width:0}
.act:active{transform:translateY(.5cqw);box-shadow:0 .4cqw 0 var(--edge)}
.act b{font-size:1.05em;white-space:nowrap;overflow:hidden;display:block;width:100%;flex:none}
.act i{font-style:normal;font-size:.8em;color:var(--dim);min-height:1em;white-space:nowrap;overflow:hidden;flex:none}
.act span{margin-top:auto;display:block;font-size:.84em;line-height:1.1}
.act span u{display:inline-block;margin-right:1.4cqw}
u{text-decoration:none}u.m{color:var(--coin)}u.e{color:var(--fire)}
.act.off{background:var(--panel)}.act.off b{color:var(--dim)}.act.off span{opacity:.6}
.act.run{background:var(--coin)}.act.run b,.act.run i,.act.run u{color:var(--edge)}
.empty{grid-column:1/-1;color:var(--dim);font-size:.9em}

.over{position:absolute;inset:0;background:var(--night);display:flex;flex-direction:column;padding:4cqw;gap:2.6cqw;font-size:4.1cqw;font-weight:500;overflow-y:auto;z-index:5;scrollbar-width:none}
.over p{color:var(--dim);line-height:1.25}
.over .logo{width:76cqw;height:auto}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
/* один макет для всех карточек: у каждой строки своя фиксированная высота */
.card{background:var(--panel);display:grid;grid-template-rows:auto 5.4cqw 9cqw 4.6cqw 4.6cqw;align-items:start;text-align:left;padding:2cqw;gap:1cqw;box-shadow:0 1cqw 0 var(--edge);min-width:0}
.card>*{min-width:0;overflow:hidden}
.card b{white-space:nowrap;display:block;width:100%}
.card em,.card i{white-space:nowrap;text-overflow:ellipsis}
.dicebox{width:100%;aspect-ratio:110/78;background:#3a2d5e;display:flex;align-items:center;justify-content:center}
.card:hover,.card:focus-visible{background:var(--panel-hi)}
.card:active{transform:translateY(.6cqw)}
.card canvas{width:100%;aspect-ratio:110/78;background:#3a2d5e}
.dice{width:18cqw;height:18cqw;background:var(--ink);box-shadow:0 1.2cqw 0 var(--hot);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:2.6cqw;gap:.9cqw}
.dice s{background:var(--edge)}.dice s:nth-child(1){grid-area:1/1}.dice s:nth-child(2){grid-area:1/3}.dice s:nth-child(3){grid-area:2/2}.dice s:nth-child(4){grid-area:3/1}.dice s:nth-child(5){grid-area:3/3}
#mk input{font:inherit;font-weight:700;color:var(--ink);background:var(--edge);border:0;padding:2cqw;width:100%;outline:.6cqw solid var(--panel-hi)}
#mk input:focus{outline-color:var(--coin)}
#mk canvas{width:60%;aspect-ratio:110/78;background:#3a2d5e;align-self:center}
#mk .kv{display:flex;flex-direction:column;gap:1cqw;font-size:.9em}#mk .kv b{color:var(--coin)}#mk .kv i{font-style:normal;color:var(--ok)}
.card b{font-weight:700;font-size:1.05em;color:var(--ink)}
.card small{font-size:.84em;color:var(--dim);line-height:1.15}
.card em{font-style:normal;font-size:.84em;color:var(--coin);font-weight:600}
.card i{font-style:normal;font-size:.84em;color:var(--ok);line-height:1.15}
.big{background:var(--hot);color:var(--edge);font-weight:700;padding:3cqw;box-shadow:0 1cqw 0 #8a1c33;text-align:left}
.big.alt{background:var(--ink);box-shadow:0 1cqw 0 var(--hot)}
.big small{display:block;font-weight:500;font-size:.8em;margin-top:.6cqw}
.h2{font-weight:700;font-size:1.7em;color:var(--coin);line-height:1.1;text-wrap:balance}
.modal{position:absolute;inset:0;background:rgba(10,8,24,.8);z-index:6;display:flex;align-items:center;justify-content:center;padding:6cqw;font-size:4.1cqw;font-weight:500}
.modal>div{background:var(--panel);padding:4cqw;display:flex;flex-direction:column;gap:2.4cqw;box-shadow:0 0 0 1cqw var(--edge),0 2cqw 0 1cqw var(--hot);width:100%}
.modal p{line-height:1.25}
.modal .c{color:var(--coin);font-weight:600;font-size:.9em}
.modal .row{display:flex;gap:2cqw}
.modal .row button{flex:1;padding:2.4cqw;font-weight:700;background:var(--hot);color:var(--edge);box-shadow:0 .8cqw 0 #8a1c33}
.modal .row button.sec{background:var(--panel-hi);color:var(--ink);box-shadow:0 .8cqw 0 var(--edge)}
.arhead{display:flex;gap:3cqw;align-items:flex-end}
.arhead canvas{width:36cqw;aspect-ratio:110/80;background:#3a2d5e;flex:none}
.arinfo{display:flex;flex-direction:column;gap:1cqw;font-size:.84em;color:var(--dim)}
.stat{display:grid;grid-template-columns:1fr auto;gap:.6cqw 2cqw;text-align:left;background:var(--panel-hi);padding:2cqw 2.4cqw;box-shadow:0 .9cqw 0 var(--edge);align-items:center}
.stat b{font-weight:700}
.stat em{font-style:normal;color:var(--crowd)}
.stat i{font-style:normal;font-size:.84em;color:var(--dim);grid-column:1/-1}
.stat u{font-size:.88em;margin-right:2.4cqw}
.stat .c{grid-column:1/-1;display:flex}
.stat .bar{grid-column:1/-1;height:2cqw;background:var(--edge)}.stat .bar s{display:block;height:100%;background:var(--crowd)}
.stat.off{background:var(--panel)}.stat.run{box-shadow:0 0 0 .8cqw var(--crowd)}
#stats{display:flex;flex-direction:column;gap:1.8cqw}
#disc{list-style:none;font-size:.88em}
.glist{list-style:none;display:flex;flex-direction:column;gap:1.2cqw}
.glist li{display:flex;justify-content:space-between;gap:3cqw;background:var(--edge);padding:1.6cqw 2.2cqw;color:var(--dim)}
.glist li b{color:var(--ink)}
.glist li.ok{background:var(--ok);color:var(--edge)}.glist li.ok b{color:var(--edge)}
.modal .col{display:flex;flex-direction:column;gap:2cqw}
.modal .col button{padding:2.6cqw;background:var(--panel-hi);color:var(--ink);box-shadow:0 .8cqw 0 var(--edge);text-align:left}
.modal .col button.hot{background:var(--hot);color:var(--edge);box-shadow:0 .8cqw 0 #8a1c33}
#disc li{display:grid;grid-template-columns:1fr auto 5.2em;gap:2cqw;padding:1cqw 0;border-top:.3cqw solid var(--panel)}
#disc .age{color:var(--dim);text-align:right}
.q0{color:#9790b6}.q1{color:var(--ink)}.q2{color:var(--crowd)}.q3{color:var(--fire)}.q4{color:var(--coin)}
.sub{font-weight:700;color:var(--ink);margin-top:1cqw}
/* Dela Gothic One в названиях и цифрах (одно начертание, жирный не синтезируем), Onest в тексте */
.act b,.res .num,.tabs button,.h2,.move,.chip,.plate,.badges span,.card b,.big,.stat b,.stat em,u,.fl,.glist b,.modal .row button,.modal .col button,.sub,.toast b,.goal .t b,.prog span,#mk input{font-family:var(--px);font-weight:400!important}
.act b{font-size:4.10cqw}.res .num{font-size:5.02cqw}.tabs button{font-size:3.95cqw;padding:1.3cqw 0}.h2{font-size:6.08cqw}.move{font-size:3.65cqw}.chip{font-size:3.57cqw}.plate{font-size:3.57cqw}
.badges span{font-size:3.34cqw}.card b{font-size:4.10cqw}.big{font-size:4.26cqw}.big small{font-family:var(--font);font-size:3.6cqw;font-weight:500}
.stat b{font-size:4.10cqw}.stat em{font-size:3.80cqw}.act span,.stat u{font-size:3.42cqw}.fl{font-size:4.94cqw}.glist b{font-size:3.80cqw}
.modal .row button,.modal .col button{font-size:3.95cqw}.sub{font-size:4.1cqw}.toast b{font-size:4.1cqw}.goal .t b{font-size:3.95cqw}.prog span{font-size:3.5cqw}#mk input{font-size:4.1cqw}
.pill{font-size:3.5cqw;font-weight:600}.res .lbl{font-size:3.3cqw}.act i{font-size:3.3cqw}.log{font-size:3.9cqw}.card small,.card em,.card i,.stat i{font-size:3.5cqw}
/* обучение: подсвеченные элементы с номерами и легенда */
#tour{position:absolute;inset:0;z-index:7;background:rgba(10,8,24,.62);font-size:4.1cqw;font-weight:500}
#tour .hl{position:absolute;outline:1cqw solid var(--coin);background:rgba(255,255,255,.1);pointer-events:none}
#tour li b{width:4cqw;height:4cqw;flex:none;margin-top:.6cqw}
#tour .leg{position:absolute;left:4cqw;right:4cqw;background:var(--panel);padding:3.4cqw;display:flex;flex-direction:column;gap:2.4cqw;box-shadow:0 0 0 1cqw var(--edge),0 2cqw 0 1cqw var(--hot)}
#tour ol{list-style:none;display:flex;flex-direction:column;gap:2cqw}
#tour li{display:flex;gap:2.4cqw;align-items:flex-start;line-height:1.25}
#tour .leg button{align-self:flex-start;padding:2.2cqw 5cqw;background:var(--hot);color:var(--edge);box-shadow:0 .8cqw 0 #8a1c33;font-family:var(--px);font-size:3.95cqw}
@media (prefers-reduced-motion:reduce){.fl{animation-duration:.01s}#mail{animation:none}}
</style>
</head>

    <div class="top">
      <img class="px" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJkAAAAwCAYAAAACT9icAAAEGklEQVR42u1cPZLrIAwGD82mzjFylRwilaucxtWrfAhfJcdIHZdslR2vHxghJCGyaGarNTJ81h+IL8Z06cIs1hhjXs+Hxyo4nS9oHe+xOQJ9D0R3bV2xMan3YcZRrjVXHIUSrJFux2GBTT3PARrV+iXepQG3oVSBv949N3glH5HCAF7Ph6dap7/ek7pizxyt5ev2779xtXEjMzJuL6UyktajWMrANOOmysj2kZHyA1LooopmlLI3MLtMVhtugwQI+79aH7MEsHUeVUV4CQOj+h4ux0soDS/10VJgHc3tSLe/3r1dJttKqoS+A7ImLGbrPBp/M2jcxNKlXSa7/aNMEdSeGdO/zqNoyoTWYRROwxVQwEcYqUW8zOhrRYDg3M5T9B3rPLICqlVARnmAW0kWcNyLe4fhXEOU8mBsJIylF0gpQFn/bTGQPK9rencpVYCXpEytOEAOUGs45qB5O44FK/dMicrQpdNwjsFDnuWKhEOLBiZVgEu0pFrouKjoXVIbll0mmypC13ksqvPsMlmqOlECp1gkyjlewGJWGqGdpgjFXTNwpjPOM8Xc6KttA6AiXcbOzyjTFdYIaqbM7ZxTB6nbtMmFGzYAOElDwn7kUs8MtV84z6A40nBK7zqPxpwnVtyK0uXb8jU2gEsBozCwGikoFEFS89gfltbGjTRdSqSU0/liczwr1IznqPdixsAVQY50h3bdGnBzVMpO54vljoR2may/GU+VrnMieG60h+AB0Rmbdw7W1LhVLfwlTpNzG+wUDXns2kvfezT+6H8hA9SKW5cuXbqYdihxXUz1264ttLCKjez1fPg9J3C/cIptfAxMKl5gzhxLOKNSc+PuMUpgMHwqu0db1MLwHz8FqyG0OO7QXcoHpOZAUq03xJcsNRRuQ4PwQEv1DdIGxslI0ub5VPNpPaI5quIzdKqcuiiHvTNeyp5pycA4WFbSrTMXMzCKiEZx3900dJmS0yl/HKtyH5X9FgbE2iWJDVvv1pRSsJxRqFPG2kpHY2sytFwNVlJuwzYEnhS1DRqJfx3/HGCQbD4DaWl2mazUrRkMBlWvX3MYxhGNX3O6jtVY0Ab4fjzEwf8EW2mdx58PT7FgLXfgco8CUmtvsTkdw8BV5Q1ubnJqTpm1arq1QfYUa7rEkGEptuUSHEhJQ9Z4Jla6/oEbgNQEcy4BtgJw6vYqFl/q0/mmIlmK0RIrSLnSHaXOnI0D1BEw/MeaZUEpBo56EjngffKv62jkP9ZK00NLVPvclCm9Q9unM6oUr+GXjMga5Op+L0soVXJ6MSdz6c/tLqWAay0NYeccwqhVYofDeCXlDmfPVYTS01LP5eiVIDdv54zpMUIMrGQdnBg4jW0VMJewse38e85Uv8PWiSRdijY8nfPYpUuXLprkG2isqHR7xaigAAAAAElFTkSuQmCC" alt="Громко и вместе">
      <button class="chip who" id="who" title="Артист и прокачка">Артист</button>
      <button class="chip ic" id="snd" aria-label="Звук"></button>
      <button class="chip ic" id="menuB" aria-label="Меню"><svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M1 2h10v2h-10zM1 5h10v2h-10zM1 8h10v2h-10z"/></svg></button>
    </div>
    <div class="res">
      <div><span class="num"><span id="rM">0</span></span><span class="lbl">рубли</span></div>
      <div><span class="num"><span id="rL">0</span><small id="rLd"></small></span><span class="lbl">слушатели</span></div>

    <div class="scene" id="scene">

    } else {
      html($('#goalT'), (nx ? 'Цель: <b>' + nx.n + '</b>' : 'Цель: <b>победа</b>') + ' <u class="q">?</u>');
      html($('#pills'), goalRows().map(([n, cur, need, u]) => pill(cur >= need, n.toLowerCase() + ' ' + fmt(Math.min(cur, need)) + '/' + fmt(need) + u)).join(''));
      if (nx) { mv.hidden = false; set(mv, 'Переехать'); mv.classList.toggle('off', !canMove()); mv.classList.toggle('go', canMove()); } else mv.hidden = true;
    }
    // плитки
    const vis = A.filter(a => a.tab === tab && (!a.show || a.show()));
    const key = tab + '|' + vis.map(a => a.id + a.name()).join();
    const list = $('#list');
    if (key !== listKey) {
      listKey = key;
      list.innerHTML = vis.map(a => '<button class="act" data-id="' + a.id + '"><b>' + a.name() + '</b><i></i><span></span></button>').join('') || '<p class="empty">Откроется позже.</p>';
      document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', String(+x.dataset.t === tab)));
      list.querySelectorAll('.act b').forEach(fit);
    }
    list.querySelectorAll('.act').forEach(el => {
      const a = AM[el.dataset.id], w = why(a), c = a.cost(), e = aE(a);
      set(el.children[1], a.tag ? a.tag() : '');
      html(el.children[2], (c ? '<u class="m">' + fmt(c) + ' ₽</u>' : '') + (e ? '<u class="e">' + e + ' эн.</u>' : '') + (!c && !e ? '<u class="m">даром</u>' : ''));
      el.classList.toggle('off', !!w); el.classList.toggle('run', !!(s.busy && s.busy.id === a.id));
    });
    if (!$('#artist').hidden) renderArtist(true);
  }

  /* ---------- действия и подсказки ---------- */
  let pending = null;
  function press(id) {
    AU.init();
    const a = AM[id], s = G.S;
    if (!s.seen[id]) {   // первая встреча с действием: показываем подсказку
      s.seen[id] = 1; pending = id;
      $('#hintT').textContent = a.name(); $('#hintD').textContent = aHint(a);
      const c = a.cost(), e = aE(a);
      $('#hintC').textContent = (c ? fmt(c) + ' ₽' : 'Бесплатно') + (e ? ' · ' + e + ' энтузиазма' : '') + ' · ' + Math.round(a.dur()) + ' с';
      $('#hintGo').hidden = !!why(a); $('#hint').hidden = false; AU.sfx('tap'); return;
    }
    const w = why(a);
    if (w) { say(w, 'bad'); AU.sfx('no'); return; }
    doAct(id); AU.sfx('tap'); paint();
  }
  $('#hintGo').addEventListener('click', () => { $('#hint').hidden = true; if (pending) press(pending); pending = null; });
  $('#hintNo').addEventListener('click', () => { $('#hint').hidden = true; pending = null; });
  $('#list').addEventListener('click', e => { const b = e.target.closest('.act'); if (b) press(b.dataset.id); });
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { tab = +b.dataset.t; AU.init(); AU.sfx('tap'); paint(); } });
  $('#move').addEventListener('click', () => {
    AU.init(); const s = G.S;
    if (!canMove()) { say(s.busy ? 'Сначала закончи дело' : !goalOk() ? 'Сначала выполни цели' : 'Не хватает ' + fmt(moveCost() - s.money + 1) + ' ₽', 'bad'); AU.sfx('no'); return; }
    const nx = LV[s.lvl + 1];
    if (!s.seen['mv' + s.lvl] && nx.rent && s.money - moveCost() < nx.rent) { s.seen['mv' + s.lvl] = 1; say('Оставь на аренду ' + fmt(nx.rent) + ' ₽. Нажми ещё раз, чтобы ехать', 'bad'); return; }
    move(); paint();
  });
  $('#mail').addEventListener('click', () => { AU.init(); collect(); AU.sfx('coin'); paint(); });
  function sndBtn() { const s = G.S; $('#snd').innerHTML = ICON(s.sound); $('#snd').setAttribute('aria-label', s.sound ? 'Выключить звук' : 'Включить звук'); }
  $('#snd').addEventListener('click', () => { const s = G.S; s.sound = !s.sound; AU.init(); AU.setOn(s.sound); sndBtn(); });
  $('#toast').addEventListener('click', () => { $('#toast').hidden = true; });

  /* ---------- меню ---------- */
  let resetArm = 0;
  $('#menuB').addEventListener('click', () => { AU.init(); AU.sfx('tap'); const bi = $('#buildInfo'); bi.textContent = bi.textContent.split(' · ')[0] + ' · звук: ' + AU.state(); $('#mReset').textContent = 'Сменить группу'; resetArm = 0; $('#menu').hidden = false; });
  $('#mClose').addEventListener('click', () => { $('#menu').hidden = true; });
  $('#mGoal').addEventListener('click', () => { $('#menu').hidden = true; showGoal(false); });
  $('#mTour').addEventListener('click', () => { $('#menu').hidden = true; showTour(0); });
  $('#mArtist').addEventListener('click', () => { $('#menu').hidden = true; renderArtist(); $('#artist').hidden = false; });
  $('#mReset').addEventListener('click', () => {
    if (Date.now() - resetArm < 4000) { const done = G.S.done, seen = keepSeen(G.S.seen), snd = G.S.sound; G.S = fresh(); G.S.done = done; G.S.seen = seen; G.S.sound = snd; save(); listKey = ''; $('#menu').hidden = true; $('#artist').hidden = true; AU.setMusic('', 0); showStart(); }
    else { resetArm = Date.now(); $('#mReset').textContent = 'Прогресс сгорит. Точно?'; }
  });

  /* ---------- экран артиста: прокачка, дискография ---------- */
  function renderArtist(light) {
    const s = G.S, a = act();
    if (!light) {
      $('#arN').textContent = a.n; $('#arS').textContent = a.slogan;
      const c = $('#arC').getContext('2d'); c.clearRect(0, 0, 110, 80); SC.lineup(c, a, (a.id === 'solt' || a.id === 'rynok') ? s.lvl : a.id === 'vrubel' ? s.albums % 4 : 0, 55, 78, 32);
    }
    html($('#arI'), '<span>Жанр: ' + genre() + '</span><span>' + perkText() + '</span>' + (s.done.length ? '<span>Пройдено артистов: ' + s.done.length + '</span>' : ''));
    html($('#stats'), Object.keys(STATS).map(k => {
      const lvl = s.stats[k], on = s.train && s.train.k === k, w = whyTrain(k), max = lvl >= STAT_MAX;
      return '<button class="stat' + (w && !on ? ' off' : '') + (on ? ' run' : '') + '" data-k="' + k + '"><b>' + STATS[k].n + '</b><em>' + lvl + '/' + STAT_MAX + '</em><i>' + STATS[k].d + '</i>' +
        (on ? '<span class="bar"><s style="width:' + (s.train.t / s.train.dur * 100) + '%"></s></span>' : '<span class="c">' + (max ? '<u>максимум</u>' : '<u class="m">' + fmt(statCost(k)) + ' ₽</u><u class="e">30 эн.</u><u>' + (statDur(k) >= 120 ? Math.round(statDur(k) / 60) + ' мин' : statDur(k) + ' с') + '</u>') + '</span>') + '</button>';
    }).join(''));
    if (!light) html($('#disc'), s.songs.length ? s.songs.slice(-12).reverse().map(x => { const f = songFresh(x); return '<li><span>' + x.n + (x.alb ? ' · альбом' : '') + '</span><span class="q' + x.q + '">' + Q[x.q].n + '</span><span class="age">' + (f > 0.6 ? 'свежая' : f > 0 ? 'на слуху' : 'забыта') + '</span></li>'; }).join('') : '<li>Песен пока нет.</li>');
  }
  $('#who').addEventListener('click', () => { AU.init(); AU.sfx('tap'); renderArtist(); $('#artist').hidden = false; });
  $('#arX').addEventListener('click', () => { $('#artist').hidden = true; });
  $('#stats').addEventListener('click', e => { const b = e.target.closest('.stat'); if (!b) return; const k = b.dataset.k, w = whyTrain(k); if (G.S.train && G.S.train.k === k) return; if (w) { $('#arMsg').textContent = w; AU.sfx('no'); return; } train(k); $('#arMsg').textContent = STATS[k].n + ': тренировка идёт.'; AU.sfx('tap'); renderArtist(); });

  /* ---------- старт и финал ---------- */
  function pick(i) { AU.init(); G.S.act = i; G.S.last = Date.now(); $('#start').hidden = true; $('#mk').hidden = true; begin(); say('Начни с песни: вкладка «Музыка».'); AU.sfx('up'); showGoal(true); }
  function showStart() {
    const c = $('#cards'); c.innerHTML = '';
    ACTS.forEach((a, i) => {
      const b = document.createElement('button'); b.className = 'card';
      b.innerHTML = '<canvas width="110" height="78"></canvas><b>' + a.n + (G.S.done.includes(i) ? ' ★' : '') + '</b><small>' + a.slogan + '</small><em>' + a.genre + '</em><i>' + PERKS[a.pk].toLowerCase() + '</i>';   // на карточках перки строчными
      b.addEventListener('click', () => pick(i));
      // наведение или фокус: звучит жанр этого артиста, ушли — снова тема меню
      const on = () => AU.setMusic(musicOf(a, 0, 0), 4), off = () => { if (!$('#start').hidden && $('#mk').hidden) AU.setMusic('меню', 2); };
      b.addEventListener('pointerenter', on); b.addEventListener('focus', on); b.addEventListener('pointerleave', off); b.addEventListener('blur', off);
      c.appendChild(b);
      SC.lineup(b.querySelector('canvas').getContext('2d'), a, 0, 55, 76, 32);
    });
    const b = document.createElement('button'); b.className = 'card mk';
    b.innerHTML = '<span class="dicebox"><span class="dice"><s></s><s></s><s></s><s></s><s></s></span></span><b>Своя группа</b><small>Всё решает кубик.</small><em>случайный жанр</em><i>случайный перк</i>';
    b.addEventListener('click', () => { AU.init(); rollMk(); $('#mk').hidden = false; });
    c.appendChild(b);
    $('#start').hidden = false;
    c.querySelectorAll('.card b').forEach(fit);
    AU.setOn(G.S.sound); AU.setMusic('меню', 2);
    $('#title').hidden = AU.ready();   // браузер молчит до первого касания: заставка с кнопкой его и даёт
  }
  $('#titleGo').addEventListener('click', () => { AU.init(); AU.setOn(G.S.sound); AU.setMusic('меню', 2); AU.sfx('up'); $('#title').hidden = true; });
  /* своя группа: всё случайное, вписать можно только название */
  let mk = null;
  function rollMk() {
    mk = rollCustom(''); $('#mkN').value = mk.n;
    $('#mkG').textContent = mk.genre; $('#mkP').textContent = PERKS[mk.pk];
    const x = $('#mkC').getContext('2d'); x.clearRect(0, 0, 110, 78);
    SC.lineup(x, { id: 'cust', cast: mk.ppl }, 0, 55, 76, 32); AU.sfx('promo'); AU.setMusic(mk.genre, 4);   // сразу слышно выпавший жанр
  }
  $('#mkR').addEventListener('click', rollMk);
  $('#mkGo').addEventListener('click', () => { mk.n = $('#mkN').value.trim().slice(0, 28) || mk.n; G.S.custom = mk; pick(CUSTOM); });
  $('#mkX').addEventListener('click', () => { $('#mk').hidden = true; AU.setMusic('меню', 2); });
  $('#winP').addEventListener('click', () => { G.S.mode = 'prestige'; $('#win').hidden = true; say('Престиж: предел — 8 млрд слушателей.', 'hit'); paint(); });
  $('#winN').addEventListener('click', () => { const s = G.S, done = s.done.includes(s.act) ? s.done : s.done.concat(s.act), seen = keepSeen(s.seen), snd = s.sound; AU.setMusic('', 0); G.S = fresh(); G.S.done = done; G.S.seen = seen; G.S.sound = snd; $('#win').hidden = true; save(); showStart(); });

  function begin() { const s = G.S; $('#who').textContent = act().n; fit($('#who')); sndBtn(); AU.setOn(s.sound); music(); listKey = ''; paint(); }

  /* ---------- цикл ---------- */
  const cv = $('#cv'), ctx = cv.getContext('2d');
  let last = 0, acc = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000) || 0; last = now;
    const s = G.S;
    if (s.act !== null && IMG) {
      if (!paused()) tick(dt);
      SC.step(dt); if (jump > 0) jump -= dt; if (bow > 0) bow -= dt;
      SC.draw(ctx, now / 1000, { S: s, act: act(), att: att(), cap: lv().cap, goal: lv().goalL, jump, bow });
      if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('#toast').hidden = true; }
      acc += dt; if (acc > 0.12) { acc = 0; paint(); }
    }
    requestAnimationFrame(frame);
  }
  function start(data) {
    G.S = fresh();
    let saved = data && data.S;
    if (!saved) { try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {} }
    if (saved && typeof saved === 'object' && saved.v === 2 && (saved.act === null || saved.act < ACTS.length || (saved.act === CUSTOM && saved.custom))) { const st = Object.assign({}, G.S.stats, saved.stats); Object.assign(G.S, saved); G.S.stats = st; }
    offline(Date.now());
    document.querySelectorAll('#tabs button').forEach((b, i) => b.textContent = TABS[i]);
    sndBtn();
    // два атласа спрайтов: основной и пул музыкантов; игра стартует, когда загружены оба
    let left = ATLAS_SRC.length;
    IMGS = ATLAS_SRC.map(src => { const im = new Image(); im.onload = () => { if (--left === 0) { IMG = IMGS[0]; SC.set(IMGS, ATLAS); if (G.S.act === null) showStart(); else begin(); requestAnimationFrame(frame); } }; im.src = src; return im; });
    try { const tg = window.Telegram && window.Telegram.WebApp; if (tg && tg.initData) { tg.ready(); tg.expand(); } } catch (e) {}   // в Telegram: развернуть на весь экран
    // браузер не даёт звучать до первого касания: включаем звук при первом же нажатии где угодно
    // будим звук на каждое касание: iPhone принимает только touchend/click и усыпляет звук после сворачивания
    const wake = () => { if (G.S.sound) AU.init(); }; ['touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, wake, { passive: true }));
    setInterval(save, 4000);
    document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { offline(Date.now()); if (AU.ready() && G.S.sound) AU.init(); } });
    window.addEventListener('resize', () => { listKey = ''; });
  }
  window.claude?.hot?.snapshot?.(() => ({ S: G.S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();

</script>
</body>
</html>
